<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>커피형 인간입니다 — 본인의 혈액 속 커피 유전자를 분석해드립니다.</title>

  <!-- html2canvas for saving result -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root{
      --bg:#f5efe9;
      --card:#fff;
      --muted:#7a6a5a;
      --coffee-dark:#6b3e26;
      --coffee-mid:#a67856;
      --tap:48px;
      --radius:14px;
      --shadow:0 6px 20px rgba(107,62,38,0.06);

      /* 결과 카드 공통 변수 */
      --ink:#4a2c1a;
      --card-bg:#fffdf7;
      --line:rgba(0,0,0,0.12);
      --accent:#a67856;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Noto Sans KR',system-ui,-apple-system;
      background:var(--bg);
      color:var(--coffee-dark);
      padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      line-height:1.45;
    }
    .wrap{
      max-width:880px;
      margin:0 auto;
      padding:24px;
      background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0.85));
      border-radius:var(--radius);
    }
    header{display:flex;align-items:center;gap:14px;margin-bottom:10px}
    header img{width:64px;height:64px;border-radius:12px;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,0.06)}
    h1{font-size:22px}
    p.lead{margin-top:4px;color:var(--muted);font-size:14px}

    .card{background:var(--card);padding:18px;border-radius:12px;margin-top:16px;box-shadow:var(--shadow)}
    .question{margin-bottom:22px}
    .q-title{font-weight:800;font-size:15px;margin-bottom:10px}

    .likert-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
    .likert-label{width:80px;text-align:center;color:var(--coffee-dark);font-weight:700;font-size:13px}
    .likert{display:flex;gap:18px;justify-content:space-between;flex:1}
    .likert label{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
    .likert input{display:none}
    .dot{width:var(--tap);height:var(--tap);border-radius:50%;border:3px solid rgba(107,62,38,0.25);display:flex;align-items:center;justify-content:center;transition:all .18s}
    .likert input:checked+.dot{background:var(--coffee-mid);border-color:var(--coffee-mid);box-shadow:0 6px 18px rgba(0,0,0,0.08)}
    .dot small{font-size:12px;color:var(--muted)}
    .likert input:checked+.dot small{color:white}

    button{
      background:var(--coffee-dark);
      border:none;
      color:white;
      padding:12px 16px;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      font-size:14px;
      box-shadow:0 6px 14px rgba(107,62,38,0.18);
    }
    .actions{text-align:right;margin-top:12px}
    .status{margin-top:6px;font-size:13px;color:var(--muted)}

    /* 결과 영역 */
    .result-wrap{
      display:none;
      justify-content:center;
      margin-top:28px;
    }

    .result-container{
      width:100%;
      max-width:460px;
      display:flex;
      justify-content:center;
    }
    .result-card{
      width:100%;
      max-width:420px;
      aspect-ratio:9/16;
      background:var(--card-bg);
      border-radius:16px;
      border:1px solid var(--line);
      padding:18px;
      display:flex;
      flex-direction:column;
      color:var(--ink);
    }

    /* 테마 (5종) */
    .theme-sour{ --card-bg:#f4f2e8; --accent:#e6a05e; --ink:#593d2c; }
    .theme-nutty{ --card-bg:#f3ece4; --accent:#c69c6d; --ink:#4a3524; }
    .theme-bitter{ --card-bg:#efe9de; --accent:#6b4530; --ink:#2b1a12; }
    .theme-sourgoso{ --card-bg:#f3eee4; --accent:#d4ad75; --ink:#493626; }
    .theme-blend{ --card-bg:#f4efe7; --accent:#a87c56; --ink:#3a2a1c; }

    /* 결과 저장 버튼 */
    .save-btn{
      margin-top:12px;
      background:#6b3e26;
      width:100%;
      padding:10px;
      font-size:13px;
      border-radius:10px;
    }

    /* TOP3 BOX */
    .top3-box{
      margin-top:12px;
      background:rgba(255,255,255,0.85);
      border:1px solid var(--line);
      padding:12px;
      border-radius:10px;
      font-size:12px;
    }

    /* 다시 검사하기 */
    .retry-btn{
      margin-top:12px;
      background:#a67856;
      width:100%;
      padding:10px;
      font-size:13px;
      border-radius:10px;
      font-weight:700;
      color:white;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 상단 헤더 -->
    <header>
      <img src="./logo.png" alt="로고">
      <div>
        <h1>커피형 인간입니다.</h1>
        <p class="lead">본인의 혈액 속 커피 유전자를 분석해드립니다.</p>
      </div>
    </header>

    <!-- 설문 -->
    <div class="card">
      <div class="question">
        <div class="q-title">1) 상큼함</div>
        <div class="likert-row">
          <div class="likert-label">좋아함</div>
          <div class="likert">
            <label><input type="radio" name="sour" value="4"><div class="dot"><small>매우</small></div></label>
            <label><input type="radio" name="sour" value="3"><div class="dot"><small>약간</small></div></label>
            <label><input type="radio" name="sour" value="2"><div class="dot"><small>보통</small></div></label>
            <label><input type="radio" name="sour" value="1"><div class="dot"><small>전혀</small></div></label>
          </div>
          <div class="likert-label">싫어함</div>
        </div>
      </div>

      <div class="question">
        <div class="q-title">2) 고소함</div>
        <div class="likert-row">
          <div class="likert-label">좋아함</div>
          <div class="likert">
            <label><input type="radio" name="nutty" value="4"><div class="dot"><small>매우</small></div></label>
            <label><input type="radio" name="nutty" value="3"><div class="dot"><small>약간</small></div></label>
            <label><input type="radio" name="nutty" value="2"><div class="dot"><small>보통</small></div></label>
            <label><input type="radio" name="nutty" value="1"><div class="dot"><small>전혀</small></div></label>
          </div>
          <div class="likert-label">싫어함</div>
        </div>
      </div>

      <div class="question">
        <div class="q-title">3) 쌉사름함</div>
        <div class="likert-row">
          <div class="likert-label">좋아함</div>
          <div class="likert">
            <label><input type="radio" name="bitter" value="4"><div class="dot"><small>매우</small></div></label>
            <label><input type="radio" name="bitter" value="3"><div class="dot"><small>약간</small></div></label>
            <label><input type="radio" name="bitter" value="2"><div class="dot"><small>보통</small></div></label>
            <label><input type="radio" name="bitter" value="1"><div class="dot"><small>전혀</small></div></label>
          </div>
          <div class="likert-label">싫어함</div>
        </div>
      </div>

      <div id="status" class="status">데이터 불러오는 중…</div>

      <div class="actions">
        <button onclick="calcResult()">결과 보기</button>
      </div>
    </div>

    <!-- 결과 -->
    <div class="result-wrap" id="resultWrap">
      <div class="result-container">
        <div class="result-card theme-sour" id="resultCard">

          <header class="report-header">
            <img src="./logo.png" class="brand-logo">
            <div>
              <div class="report-head-text">CAFFEINE GENOME PROJECT</div>
              <div class="report-head-title">커피 유전자 검사 결과서</div>
            </div>
          </header>

          <section class="main-box">
            <h1>커피형 인간입니다.</h1>
            <p class="subject">검사 대상: <span id="userName">당신</span>님</p>
            <p class="type-line">유형: <strong id="resultType">상큼형</strong></p>
            <p class="type-desc" id="typeDesc">설명</p>
          </section>

          <section class="cafe-box">
            <div class="cafe-label">RECOMMENDED CAFE</div>
            <div class="cafe-name" id="bestCafeName"></div>
            <p class="cafe-note">당신에게 가장 잘 맞는 카페입니다.</p>
          </section>

          <section class="profile-box">
            <h2>맛 프로파일</h2>
            <div class="profile-row">
              <div class="profile-label">상큼함</div>
              <div class="profile-dots" id="dotAcid"></div>
              <div class="profile-text" id="txtAcid"></div>
            </div>

            <div class="profile-row">
              <div class="profile-label">고소함</div>
              <div class="profile-dots" id="dotNutty"></div>
              <div class="profile-text" id="txtNutty"></div>
            </div>

            <div class="profile-row">
              <div class="profile-label">쌉사름</div>
              <div class="profile-dots" id="dotBitter"></div>
              <div class="profile-text" id="txtBitter"></div>
            </div>
          </section>

          <section class="note-box">
            <h2>해석 메모</h2>
            <p id="noteText"></p>
          </section>

          <div class="top3-box">
            <h3>비슷한 커피 TOP3</h3>
            <ul id="top3List"></ul>
          </div>

          <button class="save-btn" id="saveImageBtn">📱 결과 이미지 저장하기</button>
          <button class="retry-btn" onclick="retry()">🔄 다시 검사하기</button>

        </div>
      </div>
    </div>

  </div>

  <script>
    const JSON_URL = './coffee-data.json?v=10';
    let coffeeList = [];
    let lastFetched = null;

    const statusEl = document.getElementById('status');

    async function fetchCoffeeData(){
      try{
        const res = await fetch(JSON_URL,{cache:'no-store'});
        const list = await res.json();
        coffeeList = list;
        statusEl.textContent = `저장된 커피 데이터 총 ${list.length}개`;
      }catch(e){
        statusEl.textContent = '데이터 로드 실패';
      }
    }

    fetchCoffeeData();

    function getScore(name){
      return Number(document.querySelector(`input[name="${name}"]:checked`)?.value);
    }

    const TYPE_CONFIG = {
      sour:{label:"상큼형",theme:"theme-sour",desc:"상큼한 향 선호",note:"라이트 로스팅 추천"},
      nutty:{label:"고소형",theme:"theme-nutty",desc:"구수한 풍미 선호",note:"고소 블렌드 추천"},
      bitter:{label:"쌉사름형",theme:"theme-bitter",desc:"진한 맛 선호",note:"다크 로스팅 추천"},
      sourgoso:{label:"상큼고소형",theme:"theme-sourgoso",desc:"상큼+고소 조화",note:"밸런스 블렌드 추천"},
      blend:{label:"블렌드형",theme:"theme-blend",desc:"복합 풍미",note:"다양한 맛과 어울림"},
    };

    function classifyType(s,n,b){
      const max = Math.max(s,n,b);

      if (s >= max && s >= n+1 && s >= b+1) return 'sour';
      if (n >= max && n >= s+1 && n >= b+1) return 'nutty';
      if (b >= max && b >= s+1 && b >= n+1) return 'bitter';

      if (Math.abs(s-n)<=1 && s>=2 && n>=2) return 'sourgoso';

      return 'blend';
    }

    function makeDots(score){
      return ("● ".repeat(score) + "○ ".repeat(4-score)).trim();
    }

    function renderTop3(s,n,b){
      const ranked = coffeeList.map(c=>({
        name:c.name,
        score:Math.abs(s-c.acidity)+Math.abs(n-c.nutty)+Math.abs(b-c.bitter)
      }))
      .sort((a,b)=>a.score-b.score)
      .slice(0,3);

      document.getElementById("top3List").innerHTML =
        ranked.map((c,i)=>`<li><strong>${i+1}위</strong> — ${c.name}</li>`).join("");
    }

    function renderResult(best, s, n, b){
      const typeKey = classifyType(s,n,b);
      const config = TYPE_CONFIG[typeKey];
      const card = document.getElementById("resultCard");

      card.className = "result-card " + config.theme;

      document.getElementById("resultType").textContent = config.label;
      document.getElementById("typeDesc").textContent  = config.desc;
      document.getElementById("bestCafeName").textContent = best.name;
      document.getElementById("noteText").textContent = config.note;

      document.getElementById("dotAcid").textContent   = makeDots(s);
      document.getElementById("dotNutty").textContent  = makeDots(n);
      document.getElementById("dotBitter").textContent = makeDots(b);

      document.getElementById("txtAcid").textContent =
        s>=3?"상큼함 뚜렷":s===2?"상큼함 적당":"상큼함 약함";

      document.getElementById("txtNutty").textContent =
        n>=3?"고소함 강함":n===2?"고소함 적당":"고소함 약함";

      document.getElementById("txtBitter").textContent =
        b>=3?"쌉사름 강함":b===2?"쌉사름 적당":"쌉사름 약함";

      renderTop3(s,n,b);

      const wrap = document.getElementById("resultWrap");
      wrap.style.display = "flex";
      wrap.scrollIntoView({behavior:"smooth"});
    }

    function calcResult(){
      const s = getScore('sour'), n = getScore('nutty'), b = getScore('bitter');

      if(!s||!n||!b){
        alert("모든 항목을 선택하세요.");
        return;
      }

      if(!coffeeList.length){
        alert("데이터가 없습니다.");
        return;
      }

      let best=null, bestScore=Infinity;

      coffeeList.forEach(c=>{
        const dist = Math.abs(s-c.acidity)+Math.abs(n-c.nutty)+Math.abs(b-c.bitter);
        if(dist<bestScore){
          bestScore=dist;
          best=c;
        }
      });

      renderResult(best, s, n, b);
    }

    // 결과 이미지 저장
    document.getElementById("saveImageBtn").addEventListener("click", ()=>{
      const target = document.getElementById("resultCard");
      html2canvas(target, {scale:2}).then(canvas=>{
        const link=document.createElement("a");
        link.download="coffee-result.jpg";
        link.href=canvas.toDataURL("image/jpeg",0.9);
        link.click();
      });
    });

    // 다시 검사하기
    function retry(){
      document.querySelectorAll("input[type=radio]").forEach(el=>el.checked=false);
      document.getElementById("resultWrap").style.display="none";
      window.scrollTo({top:0,behavior:"smooth"});
    }
  </script>
</body>
</html>
